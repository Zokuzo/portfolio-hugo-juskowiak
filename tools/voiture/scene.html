<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>rendu — séquence voiture</title>
<style>html,body{margin:0;height:100%;background:#111}canvas{display:block}</style>

<!-- three.js est tiré du CDN ici : cette page tourne dans un Chrome nu,
     sans bundler. Depuis le chantier #12, `three` est AUSSI une dépendance
     du site (le drag est un besoin de runtime) — épinglée à la MÊME version
     0.169.0 que cet importmap : un pipeline et un client sur deux versions
     seraient un raccord qui dérive sans qu'aucun code n'ait bougé. -->
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from "three"
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js"
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js"
/* Le studio, les retouches et la mise en place viennent du module
   PARTAGÉ avec le client (chantier #12) — servi par l'alias de
   rendu.mjs. Il n'y a plus qu'un studio, et ses commentaires de
   doctrine ont déménagé avec lui. */
import { studio, studioClair, retouches, retouchesClair, regleRenderer, prepareModele, appliqueRetouches, placeCamera,
         FOV as FOV_DEFAUT, FLOU_PMREM, CARROSSERIE, RUGOSITE } from "/studio.mjs"

const P = new URLSearchParams(location.search)
const n      = (k, d) => { const v = P.get(k); return v === null ? d : +v }
const MODELE = P.get("modele")
const NB     = n("nb", 60)
const RENDU  = n("rendu", 2000)     // on rend grand pour redescendre : c'est l'antialiasing le moins cher
const SORTIE = n("sortie", 1000)
const FOV    = n("fov", FOV_DEFAUT)
const ELEV   = n("elevation", 13)   // degrés au-dessus de l'horizon (la production passe 30)
const DEPART = n("depart", 0)       // azimut de l'image 000
const SENS   = n("sens", 1)
const ENV    = n("env", 1)
const MARGE  = n("marge", 1.02)     // respiration autour du cadrage automatique
const CARRO  = P.get("carrosserie") || CARROSSERIE
const RUGO   = n("rugosite", RUGOSITE)
const STUDIO = P.get("studio") || "sombre"   // clair : boîte papier, bandes d'encre, livrée d'origine (#13)

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
regleRenderer(THREE, renderer)
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = null          // le fond transparent, c'est tout l'intérêt du format
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 5000)

const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(STUDIO === "clair" ? studioClair(THREE) : studio(THREE), FLOU_PMREM).texture
scene.environmentIntensity = ENV
// Aucune lumière ajoutée : tout vient de l'environnement. C'est ce qui
// garantit qu'il n'y a ni ombre au sol ni éclairage diffus.

const voiture = new THREE.Group()
scene.add(voiture)

let materiaux = []
let cadre = null   // rectangle de recadrage, en fractions de l'image rendue

const loader = new GLTFLoader()
const draco = new DRACOLoader()
draco.setDecoderPath("https://unpkg.com/three@0.169.0/examples/jsm/libs/draco/gltf/")
loader.setDRACOLoader(draco)
loader.setMeshoptDecoder(MeshoptDecoder)   // meshopt ET Draco branchés : l'outil relit tout candidat (#12 a tranché Draco)

function pose(i) {
  voiture.rotation.y = THREE.MathUtils.degToRad(DEPART + SENS * i * 360 / NB)
}

/* Cadrage automatique. La caméra est placée large, puis on mesure sur
   les NB images l'union des pixels non transparents. Recadrer sur cette
   union donne une voiture aussi grande que possible SANS jamais la
   rogner, et surtout un cadre IDENTIQUE d'une image à l'autre : c'est ce
   qui supprime le flottement. Cadrer image par image la ferait respirer
   à chaque tour de roue. */
function mesure(res) {
  renderer.setSize(res, res, false)
  const tampon = document.createElement("canvas")
  tampon.width = tampon.height = res
  const g = tampon.getContext("2d", { willReadFrequently: true })
  let x0 = res, y0 = res, x1 = -1, y1 = -1
  for (let i = 0; i < NB; i++) {
    pose(i)
    renderer.render(scene, camera)
    g.clearRect(0, 0, res, res)
    g.drawImage(renderer.domElement, 0, 0)
    const d = g.getImageData(0, 0, res, res).data
    for (let y = 0; y < res; y++) {
      for (let x = 0; x < res; x++) {
        if (d[(y * res + x) * 4 + 3] > 6) {
          if (x < x0) x0 = x; if (x > x1) x1 = x
          if (y < y0) y0 = y; if (y > y1) y1 = y
        }
      }
    }
  }
  if (x1 < 0) throw new Error("rien de visible : la voiture est hors champ")
  // Carré centré sur l'union, côté = la plus grande dimension.
  const cx = (x0 + x1 + 1) / 2, cy = (y0 + y1 + 1) / 2
  const cote = Math.max(x1 - x0 + 1, y1 - y0 + 1) * MARGE
  return { x: (cx - cote / 2) / res, y: (cy - cote / 2) / res, c: cote / res }
}

const sortie = document.createElement("canvas")
sortie.width = sortie.height = SORTIE
const gs = sortie.getContext("2d")
gs.imageSmoothingQuality = "high"

window.rendreFrame = (i) => {
  renderer.setSize(RENDU, RENDU, false)
  pose(i)
  renderer.render(scene, camera)
  gs.clearRect(0, 0, SORTIE, SORTIE)
  gs.drawImage(
    renderer.domElement,
    cadre.x * RENDU, cadre.y * RENDU, cadre.c * RENDU, cadre.c * RENDU,
    0, 0, SORTIE, SORTIE
  )
  return sortie.toDataURL("image/png")
}

loader.load(MODELE, (gltf) => {
  const m = gltf.scene
  voiture.add(m)
  const rayon = prepareModele(THREE, m)
  materiaux = appliqueRetouches(m, STUDIO === "clair" ? retouchesClair() : retouches({ carrosserie: CARRO, rugosite: RUGO }))
  window.materiaux = materiaux
  placeCamera(THREE, camera, rayon, ELEV)
  cadre = mesure(360)
  window.cadre = cadre
  window.pret = true
}, undefined, (e) => { window.erreur = String(e && e.message || e) })
</script>
</html>
